<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Pernikahan Indra & Rika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Amiri:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fff;--grey:#8a8a8a;--line:rgba(255,255,255,.28);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html{background:#1c1c1c}
body{max-width:480px;margin:0 auto;background:#000;color:var(--paper);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.6;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
img,video{display:block;max-width:100%}
.script{font-family:'Pinyon Script',cursive;font-weight:400;line-height:1.15}
.ar{font-family:'Amiri',serif;font-size:1.5rem;line-height:2.2;direction:rtl}
h2.script{font-size:clamp(2.6rem,11vw,3.6rem);margin-bottom:.6rem}
p.sm{font-size:.95rem;color:var(--grey);letter-spacing:.04em}

/* motif elegan */
.dark{--mc:rgba(255,255,255,.06);--fc:rgba(255,255,255,.28)}
.light{--mc:rgba(0,0,0,.06);--fc:rgba(0,0,0,.28)}
.motif{background-image:linear-gradient(45deg,var(--mc) 1px,transparent 1px),linear-gradient(-45deg,var(--mc) 1px,transparent 1px);background-size:34px 34px}

/* sampul */
#cover{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
 background-color:#000;transition:opacity 1.4s var(--ease),visibility 1.4s}
#cover.gone{opacity:0;visibility:hidden}
#cover::before{content:"";position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none}
#cover::after{content:"";position:absolute;inset:20px;border:1px solid rgba(255,255,255,.12);pointer-events:none}
.cover-in{max-width:420px;width:100%}
.sq{width:min(62vw,260px);aspect-ratio:1;margin:0 auto 22px;border:1px solid #fff;padding:8px;position:relative}
.sq .ph{width:100%;height:100%}
#cover .t{letter-spacing:.3em;font-size:.8rem}
#cover h1{font-size:clamp(3.4rem,17vw,5rem);margin:.2rem 0}
#cover .guest{margin:14px 0 20px;font-size:1rem}
#cover .guest b{display:block;font-size:1.35rem;font-weight:600;color:#fff}
.btn{display:inline-block;background:#fff;color:#000;border:1px solid #fff;padding:12px 30px;font:inherit;font-size:1rem;letter-spacing:.08em;cursor:pointer;transition:.4s var(--ease)}
.btn:hover{background:transparent;color:#fff}
.light .btn{background:#000;color:#fff;border-color:#000}.light .btn:hover{background:transparent;color:#000}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.ghost:hover{background:#fff;color:#000}
.light .btn.ghost:hover{background:#000;color:#fff}

/* tombol musik */
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:120;width:46px;height:46px;border-radius:50%;border:1px solid #fff;background:#000;color:#fff;font-size:18px;cursor:pointer}
#music.spin{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* halaman: selebar & setinggi layar HP */
#cover{left:50%;right:auto;width:100%;max-width:480px;transform:translateX(-50%)}
#music{right:max(14px,calc(50vw - 226px))}
.sec{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:max(52px,env(safe-area-inset-top,0px)) 22px max(48px,env(safe-area-inset-bottom,0px));text-align:center;overflow:hidden}
.dark{background-color:#000;color:#fff}
.light{background-color:#fff;color:#000}
.light p.sm{color:#555}
.in{width:100%;margin:0 auto;will-change:opacity}
.rule{width:60px;height:1px;background:currentColor;margin:14px auto;opacity:.5}

/* ph = placeholder foto */
.ph{background:#1b1b1b;position:relative;overflow:hidden}
.light .ph{background:#e6e6e6}
.ph::after{content:"Foto";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#777;font-size:.9rem;letter-spacing:.2em}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

/* transisi masuk berbeda-beda */
[data-a]{opacity:0;transition:opacity 1.3s var(--ease),transform 1.3s var(--ease),filter 1.3s var(--ease)}
[data-a="up"]{transform:translateY(46px)}
[data-a="down"]{transform:translateY(-46px)}
[data-a="left"]{transform:translateX(-60px)}
[data-a="right"]{transform:translateX(60px)}
[data-a="zoom"]{transform:scale(.8)}
[data-a="blur"]{filter:blur(14px)}
[data-a="flip"]{transform:perspective(700px) rotateX(35deg) translateY(30px)}
[data-a="rot"]{transform:rotate(-6deg) scale(.9)}
[data-a].show{opacity:1;transform:none;filter:none}

/* mempelai */
.couple{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;align-items:start}
.person .ph{width:min(100%,26svh);aspect-ratio:3/4;margin:0 auto 12px;border-radius:200px 200px 0 0;border:1px solid currentColor}
.person h3{font-size:1.9rem}
.person p.sm{font-size:.85rem;line-height:1.4;margin-top:4px}
.big{font-size:clamp(3.2rem,16vw,4.4rem)}

/* save the date */
.frame{width:min(74vw,36svh);aspect-ratio:1;margin:6px auto 18px;border:1px solid #fff;padding:8px}
.frame .ph{width:100%;height:100%}
.frame .ph img{opacity:0;transition:opacity 1.8s ease-in-out}
.frame .ph img.on{opacity:1}
#cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
#cd div{border:1px solid var(--line);padding:10px 2px}
#cd b{display:block;font-size:1.9rem;font-weight:600;line-height:1.1}
#cd span{font-size:.72rem;letter-spacing:.15em;color:var(--grey)}

/* acara */
.ev{border:1px solid #000;padding:22px 16px;margin:16px 0;position:relative}
.ev::before{content:"";position:absolute;inset:5px;border:1px solid rgba(0,0,0,.2);pointer-events:none}
.ev h3{font-size:2.2rem}
.ev .btn{padding:8px 22px;font-size:.9rem}

/* galeri: tinggi dihitung dari tinggi layar */
.gal{display:grid;gap:8px;margin-top:16px}
.gal .ph{width:100%;height:100%}
.g1{grid-template-columns:repeat(6,1fr);grid-template-rows:32svh 24svh}
.g1 .a,.g1 .b{grid-column:span 3}.g1 .c{grid-column:span 4}.g1 .d{grid-column:span 2}
.g2{grid-template-columns:repeat(12,1fr);grid-template-rows:24svh 32svh}
.g2 .v{grid-column:1/7;grid-row:1/3}.g2 .a{grid-column:7/13}.g2 .b{grid-column:7/10}.g2 .c{grid-column:10/13}

/* cerita: 3 bagian, tiap bagian satu layar dengan bentuk foto berbeda */
.story .ph{margin:12px auto 18px;border:1px solid currentColor}
.st0 .ph{width:100%;height:34svh}
.st1 .ph{width:min(62vw,36svh);height:min(62vw,36svh);border-radius:50%}
.st2 .ph{width:min(60vw,28svh);aspect-ratio:3/4;border-radius:200px 200px 0 0}
.story h3{font-size:2.4rem}
.story .yr{color:var(--grey);letter-spacing:.2em}

/* hadiah */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.card{border:1px solid var(--line);padding:14px 8px}
.card h4{font-size:1.1rem;font-weight:600}
.card .no{font-size:1.05rem;letter-spacing:.04em;word-break:break-all}
.card p.sm{font-size:.8rem}
.card button{margin-top:6px;padding:5px 12px;font-size:.8rem}
.light .card{border-color:rgba(0,0,0,.3)}

/* sampul */
.sq{width:min(60vw,30svh)}

/* form */
input,select,textarea{width:100%;padding:12px 14px;margin:6px 0;background:transparent;border:1px solid currentColor;color:inherit;font:inherit;border-radius:0}
select option{color:#000}
textarea{min-height:100px;resize:vertical}
::placeholder{color:#888}
.wishes{max-height:340px;overflow-y:auto;margin-top:22px;text-align:left;-webkit-overflow-scrolling:touch}
.wish{border-left:2px solid currentColor;padding:6px 14px;margin-bottom:14px}
.wish b{display:block;font-size:1.1rem}
.wish small{color:var(--grey);font-size:.8rem}
footer{padding:50px 20px 90px;text-align:center;background:#000}
@media(prefers-reduced-motion:reduce){[data-a]{transition:none;opacity:1;transform:none;filter:none}}
/* motif abstrak tak beraturan di setiap halaman */
.sec,#cover{position:relative}
.sec>.in,.cover-in{position:relative;z-index:1}
.mt{position:absolute;inset:0;z-index:0;pointer-events:none;background:currentColor;opacity:.15;-webkit-mask:var(--mk) center/cover no-repeat;mask:var(--mk) center/cover no-repeat}
.light .mt{opacity:.1}
.mt.fl{transform:scaleX(-1)}

const $ = (s, r = document) => r.querySelector(s);

const ph = (src, cls = "", a = "", extra = "") =>
  `<div class="ph ${cls}" ${a ? `data-a="${a}"` : ""} ${extra}>${src ? `<img src="${esc(src)}" alt="Foto" loading="lazy" onerror="this.remove()">` : ""}</div>`;
const C = CONFIG;

/* tautan peta: terima link (panjang/pendek), kode iframe, koordinat "lat,lng", atau nama tempat.
   Bila ada koordinat/nama tempat, peta tampil langsung di kartu (aman di WebView/browser dalam aplikasi)
   dan tombol "Buka di Google Maps" tetap tersedia. */
const mapBtn = (raw, e) => {
  let u = String(raw || "").trim();
  const s = u.match(/src\s*=\s*["']([^"']+)["']/i); if (s) u = s[1];
  u = u.replace(/&amp;/g, "&");
  const link = u.match(/https?:\/\/[^\s"'<>]+/i);
  const btn = h => `<a class="btn ghost" href="${esc(h)}" target="_blank" rel="noopener">Buka di Google Maps</a>`;
  const frame = q => `<iframe class="mapf" src="${esc(q)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`;
  if (link && /google\.[a-z.]+\/maps\/embed/i.test(link[0])) return frame(link[0]);
  const c = u.match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/) || u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  let q = "";
  if (c) q = c[1] + "," + c[2];
  else if (link) return btn(link[0]);                       /* link pendek: hanya tombol */
  else if (/^(www\.)?(maps\.app\.goo\.gl|goo\.gl|google\.[a-z.]+|maps\.google\.[a-z.]+)\//i.test(u)) return btn("https://" + u);
  else q = u || [e.place, e.address].filter(x => x && !/^\[.*\]$/.test(x)).join(" ");
  if (!q) return "";
  const enc = encodeURIComponent(q);
  return frame(`https://maps.google.com/maps?q=${enc}&z=16&output=embed`) + `<div style="margin-top:10px">${btn("https://www.google.com/maps/search/?api=1&query=" + enc)}</div>`;
};

 <h2 class="script" data-a="down">Momen Kami</h2>
 <div class="gal g2">
  <div class="ph v" data-a="flip">${C.video.src ? `<video src="${esc(C.video.src)}" poster="${esc(C.video.poster)}" controls playsinline preload="metadata"></video>` : ""}</div>
  ${ph(C.gallery2[0], "a", "rot")}${ph(C.gallery2[1], "b", "left")}${ph(C.gallery2[2], "c", "blur")}
 </div>`) +
C.story.map((x, i) => S((i % 2 ? "light" : "dark motif") + " story st" + (i % 3), `
 ${i === 0 ? `<h2 class="script" data-a="down">Our Love Story</h2>` : ""}
 <p class="yr" data-a="up">${x.year}</p>
 ${ph(x.photo, "", ["left", "zoom", "right"][i % 3])}
 <h3 class="script" data-a="up">${x.title}</h3>
 <p data-a="blur">${x.text}</p>`)).join("") +
S("light motif", `
 <h2 class="script" data-a="down">Wedding Gift</h2>
 <p class="sm" data-a="up">Doa restu Anda adalah hadiah terindah. Bila berkenan memberi tanda kasih:</p>
 <div class="cards">${[...C.gifts.banks, ...C.gifts.wallets].map((g, i) => acct(g, ["left", "right", "flip", "zoom"][i % 4])).join("")}</div>
 <p class="sm" data-a="up">${C.gifts.address}</p>`) +
S("dark", `
 <h2 class="script" data-a="down">RSVP</h2>
 <div data-a="up">
  <input id="rName" placeholder="Nama Anda">
  <select id="rAtt"><option>Hadir</option><option>Tidak Hadir</option><option>Masih Ragu</option></select>
  <select id="rNum"><option>1 orang</option><option>2 orang</option><option>3 orang</option><option>4 orang</option></select>
  <button class="btn" id="rBtn" style="margin-top:10px">Kirim via WhatsApp</button>
 </div>`) +
S("light motif", `
 <h2 class="script" data-a="down">Ucapan &amp; Doa</h2>
 <div data-a="zoom">
  <input id="wName" placeholder="Nama Anda" maxlength="40">
  <textarea id="wMsg" placeholder="Tulis ucapan dan doa" maxlength="400" style="min-height:76px"></textarea>
  <button class="btn" id="wBtn" style="margin-top:6px">Kirim Ucapan</button>
 </div>
 <div class="wishes" id="wishes" style="max-height:28svh"></div>`) +
S("dark", `
 <p data-a="blur">${C.closing}</p>
 <h2 class="script big" data-a="up" style="margin-top:22px">Indra &amp; Rika</h2>`);

/* sampul */
document.querySelector('[data-c="coverTitle"]').textContent = C.coverTitle;
$("#coverPhoto").innerHTML = C.coverPhoto ? `<img src="${esc(C.coverPhoto)}" alt="Indra & Rika" onerror="this.remove()">` : "";
$("#cover").classList.add("motif");
const to = new URLSearchParams(location.search).get("to");
if (to) $("#guest").textContent = to;

/* musik */
const bgm = $("#bgm"), mb = $("#music");
if (C.music) bgm.src = C.music;
const setM = on => { mb.classList.toggle("spin", on); mb.textContent = on ? "♪" : "✕"; };
setM(false); mb.textContent = "♪";
mb.onclick = () => {
  if (!C.music) return;
  if (bgm.paused) bgm.play().then(() => setM(true)).catch(() => {}); else { bgm.pause(); setM(false); mb.textContent = "♪"; }
};

/* buka undangan */
$("#openBtn").onclick = () => {
  $("#cover").classList.add("gone");
  document.body.classList.remove("locked");
  window.scrollTo(0, 0);
  if (C.music) bgm.play().then(() => setM(true)).catch(() => {});
  setTimeout(observe, 400);
};

/* animasi muncul */
function observe() {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("show"); io.unobserve(e.target); }
  }), { threshold: .15 });
  document.querySelectorAll("[data-a]").forEach(el => io.observe(el));
}

/* halaman lama memudar perlahan saat berganti halaman */
const secs = [...document.querySelectorAll(".sec .in")];
let tick = false;
function fade() {
  const vh = innerHeight;
  secs.forEach(el => {
    const b = el.parentElement.getBoundingClientRect().bottom;
    el.style.opacity = Math.max(0, Math.min(1, b / (vh * .55)));
  });
  tick = false;
}
addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(fade); } }, { passive: true });
fade();

/* slideshow: bingkai diam, hanya foto yang berganti */
const imgs = [...document.querySelectorAll("#slides img")];
if (imgs.length) {
  let i = 0; imgs[0].classList.add("on");
  setInterval(() => { imgs[i].classList.remove("on"); i = (i + 1) % imgs.length; imgs[i].classList.add("on"); }, 4000);
}

/* countdown */
const target = new Date(C.countdownDate).getTime();
function cd() {
  let t = Math.max(0, target - Date.now());
  const p = n => String(n).padStart(2, "0");
  $("#d").textContent = Math.floor(t / 864e5);
  $("#h").textContent = p(Math.floor(t % 864e5 / 36e5));
  $("#m").textContent = p(Math.floor(t % 36e5 / 6e4));
  $("#s").textContent = p(Math.floor(t % 6e4 / 1e3));
}
cd(); setInterval(cd, 1000);

/* salin rekening */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const done = () => { b.textContent = "Tersalin ✓"; setTimeout(() => b.textContent = "Salin Nomor", 1800); };
  navigator.clipboard ? navigator.clipboard.writeText(b.dataset.copy).then(done) : done();
});

/* RSVP ke WhatsApp */
$("#rBtn").onclick = () => {
  const n = $("#rName").value.trim();
  if (!n) { $("#rName").focus(); return; }
  const msg = `Assalamu'alaikum, saya ${n}. Konfirmasi kehadiran di pernikahan Indra & Rika: ${$("#rAtt").value}, jumlah tamu: ${$("#rNum").value}.`;
  window.open(`https://wa.me/${C.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
};

/* ucapan & doa (terlihat semua tamu bila firebaseURL diisi) */
const LS = "wishes_indra_rika";
async function loadW() {
  let list = [];
  try {
    if (C.firebaseURL) {
      const r = await fetch(C.firebaseURL.replace(/\/$/, "") + "/wishes.json");
      const o = await r.json() || {};
      list = Object.values(o);
    } else list = JSON.parse(localStorage.getItem(LS) || "[]");
  } catch (e) { try { list = JSON.parse(localStorage.getItem(LS) || "[]"); } catch (_) {} }
  list.sort((a, b) => b.t - a.t);
  $("#wishes").innerHTML = list.length ? list.map(w =>
    `<div class="wish"><b>${esc(w.n)}</b><p>${esc(w.m)}</p><small>${new Date(w.t).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" })}</small></div>`).join("")
    : `<p class="sm" style="text-align:center">Belum ada ucapan. Jadilah yang pertama.</p>`;
}
$("#wBtn").onclick = async () => {
  const n = $("#wName").value.trim(), m = $("#wMsg").value.trim();
  if (!n || !m) return;
  const w = { n, m, t: Date.now() };
  try {
    if (C.firebaseURL) await fetch(C.firebaseURL.replace(/\/$/, "") + "/wishes.json", { method: "POST", body: JSON.stringify(w) });
    else { const l = JSON.parse(localStorage.getItem(LS) || "[]"); l.push(w); localStorage.setItem(LS, JSON.stringify(l)); }
  } catch (e) {}
  $("#wMsg").value = ""; loadW();
};
loadW();
</script>
</body>
